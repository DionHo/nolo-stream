[package]
name = "nolostream"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nolostream_server"
path = "src/bin/server.rs"

[dependencies]
clap = { version = "~4.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = { version = "2", features = ["linux-static-hidraw"] }
tungstenite = "0.24"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
