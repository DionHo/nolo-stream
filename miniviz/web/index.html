<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>miniviz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; }
    #renderCanvas { display: block; width: 100vw; height: 100vh; }
    #overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #ccc;
      font: 12px/1.8 monospace;
      pointer-events: none;
      white-space: pre;
    }
    .hmd { color: #ffffff; }
    .lc  { color: #5599ff; }
    .rc  { color: #ff5555; }
    #status {
      position: fixed;
      top: 12px;
      right: 12px;
      color: #888;
      font: 12px monospace;
    }
    #graph-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 4px 6px;
      background: rgba(0,0,0,0.75);
      pointer-events: none;
    }
    .graph-row {
      display: flex;
      gap: 4px;
    }
    .graph-wrap {
      flex: 1;
    }
    .graph-title {
      font: 10px monospace;
      margin-bottom: 2px;
    }
    .graph-title.lc { color: #5599ff; }
    .graph-title.rc { color: #ff5555; }
    .graph-wrap canvas {
      display: block;
      width: 100%;
      height: 65px;
      background: #0d0d1a;
      border: 1px solid #333;
    }
    .graph-wrap.unk canvas {
      height: 115px;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="overlay">
    <span class="hmd" id="hmd-line">HMD: --</span>
    <span class="lc"  id="lc-line">L:   --</span>
    <span class="rc"  id="rc-line">R:   --</span>
  </div>
  <div id="status">connecting&hellip;</div>

  <div id="graph-panel">
    <div class="graph-row">
      <div class="graph-wrap">
        <div class="graph-title lc">L Pos [P0 P1 P2]</div>
        <canvas id="graph-l-pos"></canvas>
      </div>
      <div class="graph-wrap">
        <div class="graph-title lc">L Accel [AX AY AZ]</div>
        <canvas id="graph-l-accel"></canvas>
      </div>
      <div class="graph-wrap">
        <div class="graph-title lc">L AngVel [RX RY RZ]</div>
        <canvas id="graph-l-angvel"></canvas>
      </div>
      <div class="graph-wrap unk">
        <div class="graph-title lc">L Unknowns [E0..E9]</div>
        <canvas id="graph-l-unk"></canvas>
      </div>
    </div>
    <div class="graph-row">
      <div class="graph-wrap">
        <div class="graph-title rc">R Pos [P0 P1 P2]</div>
        <canvas id="graph-r-pos"></canvas>
      </div>
      <div class="graph-wrap">
        <div class="graph-title rc">R Accel [AX AY AZ]</div>
        <canvas id="graph-r-accel"></canvas>
      </div>
      <div class="graph-wrap">
        <div class="graph-title rc">R AngVel [RX RY RZ]</div>
        <canvas id="graph-r-angvel"></canvas>
      </div>
      <div class="graph-wrap unk">
        <div class="graph-title rc">R Unknowns [E0..E9]</div>
        <canvas id="graph-r-unk"></canvas>
      </div>
    </div>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    // Nolo/OSVR uses right-handed coordinates (Y-up, -Z forward).
    // Babylon.js defaults to left-handed; enable right-handed to match.
    scene.useRightHandedSystem = true;
    scene.clearColor = new BABYLON.Color4(0.102, 0.102, 0.18, 1);

    // Camera: orbitable, looking at origin
    const camera = new BABYLON.ArcRotateCamera('cam', -Math.PI / 2, Math.PI / 3, 3, BABYLON.Vector3.Zero(), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 0.5;
    camera.upperRadiusLimit = 20;

    // Light
    const light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 0.9;

    // Grid floor at y=0
    const ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 4, height: 4, subdivisions: 8 }, scene);
    const groundMat = new BABYLON.StandardMaterial('groundMat', scene);
    groundMat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.25);
    groundMat.wireframe = true;
    ground.material = groundMat;

    // Headset: white box 0.2 x 0.1 x 0.1
    const hmdMesh = BABYLON.MeshBuilder.CreateBox('hmd', { width: 0.2, height: 0.1, depth: 0.1 }, scene);
    const hmdMat = new BABYLON.StandardMaterial('hmdMat', scene);
    hmdMat.diffuseColor = BABYLON.Color3.White();
    hmdMesh.material = hmdMat;

    // Left controller: blue box 0.05 x 0.05 x 0.15
    const lcMesh = BABYLON.MeshBuilder.CreateBox('lc', { width: 0.05, height: 0.05, depth: 0.15 }, scene);
    const lcMat = new BABYLON.StandardMaterial('lcMat', scene);
    lcMat.diffuseColor = new BABYLON.Color3(0.2, 0.4, 1.0);
    lcMesh.material = lcMat;

    // Right controller: red box 0.05 x 0.05 x 0.15
    const rcMesh = BABYLON.MeshBuilder.CreateBox('rc', { width: 0.05, height: 0.05, depth: 0.15 }, scene);
    const rcMat = new BABYLON.StandardMaterial('rcMat', scene);
    rcMat.diffuseColor = new BABYLON.Color3(1.0, 0.2, 0.2);
    rcMesh.material = rcMat;

    engine.runRenderLoop(() => scene.render());
    window.addEventListener('resize', () => engine.resize());

    // Debug overlay helpers
    const hmdLine = document.getElementById('hmd-line');
    const lcLine  = document.getElementById('lc-line');
    const rcLine  = document.getElementById('rc-line');

    function fmt3(v) { return v.map(x => x.toFixed(3)).join(', '); }
    function fmt4(v) { return v.map(x => x.toFixed(3)).join(', '); }

    function updateLine(el, label, pos, ori, extras) {
      let s = `${label} pos=[${fmt3(pos)}]  q=[${fmt4(ori)}]`;
      if (extras) s += `  ${extras}`;
      el.textContent = s;
    }

    // ── Position EMA smoothing ─────────────────────────────────────────────
    // Optical tracking updates at ~60 Hz; USB HID polls at ~1000 Hz → same
    // position value repeats ~17 times before jumping. EMA smooths the steps.
    const EMA_ALPHA = 0.35; // higher = more responsive, lower = smoother
    const smoothedPos = {};

    function applyEMA(device, raw) {
      const prev = smoothedPos[device];
      if (!prev) { smoothedPos[device] = [...raw]; return [...raw]; }
      const out = raw.map((v, i) => EMA_ALPHA * v + (1 - EMA_ALPHA) * prev[i]);
      smoothedPos[device] = out;
      return out;
    }

    // ── Sensor graph ──────────────────────────────────────────────────────────
    // sensor_raw layout (19 i16s from block base+1, step 2):
    //   [0..2]  P0,P1,P2   — position raw
    //   [3..5]  AX,AY,AZ   — accelerometer
    //   [6..8]  RX,RY,RZ   — angular velocity (gyroscope)
    //   [9..18] E0..E9     — unknown
    const GRAPH_LEN = 300;
    const GROUPS = [
      { key: 'pos',    labels: ['P0','P1','P2'],
        colors: ['#5599ff','#55ff88','#ffaa33'] },
      { key: 'accel',  labels: ['AX','AY','AZ'],
        colors: ['#ff5555','#ff88ff','#88ccff'] },
      { key: 'angvel', labels: ['RX','RY','RZ'],
        colors: ['#33ffdd','#ff8833','#aaffaa'] },
      // sensor_raw[9..13] unpacked into individual unsigned bytes (base+19..28).
      // Confirmed: base+19=touchX, base+20=touchY, base+23=device counter LSB.
      // Tentative (OSVR ref, no shift): base+17..18 = buttons|touchID (inside AngVel[RZ] slot!),
      //   base+21=battery, base+22=unknown, base+23..26=32-bit device tick counter.
      { key: 'unk',
        labels: ['tX','tY','bat?','?22','cnt','cnt1','cnt2','cnt3','?27','?28'],
        colors: ['#aa88ff','#ff88aa','#88ffaa','#aaaa33','#88aaff','#ff5588','#55ff88','#ffaa55','#55aaff','#ff55ff'] },
    ];

    const graphData = {};
    for (const dev of ['left_controller', 'right_controller']) {
      graphData[dev] = {};
      for (const g of GROUPS) {
        graphData[dev][g.key] = g.labels.map(() => []);
      }
    }

    function pushSensorSample(device, raw) {
      const buf = graphData[device];
      if (!buf) return;
      // pos, accel, angvel: push i16 values directly
      const slices = [
        Array.from(raw.slice(0, 3)),
        Array.from(raw.slice(3, 6)),
        Array.from(raw.slice(6, 9)),
      ];
      // unk: unpack sensor_raw[9..13] (5 i16s) into individual unsigned bytes (10 total)
      const unkBytes = [];
      for (let i = 9; i < 14; i++) {
        const u = raw[i] & 0xFFFF;
        unkBytes.push((u >>> 8) & 0xFF);
        unkBytes.push(u & 0xFF);
      }
      slices.push(unkBytes);
      GROUPS.forEach((g, gi) => {
        slices[gi].forEach((v, i) => {
          buf[g.key][i].push(v);
          if (buf[g.key][i].length > GRAPH_LEN) buf[g.key][i].shift();
        });
      });
    }

    function drawGraph(canvasEl, series, colors, labels) {
      const W = canvasEl.width;
      const H = canvasEl.height;
      const ctx = canvasEl.getContext('2d');
      ctx.fillStyle = '#0d0d1a';
      ctx.fillRect(0, 0, W, H);

      if (!series || !series[0] || series[0].length < 2) return;

      let lo = Infinity, hi = -Infinity;
      for (const s of series) {
        for (const v of s) { if (v < lo) lo = v; if (v > hi) hi = v; }
      }
      if (lo === hi) { lo -= 1; hi += 1; }
      const range = hi - lo;

      // Zero line
      const zy = H - ((-lo) / range) * H;
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, zy); ctx.lineTo(W, zy); ctx.stroke();

      for (let si = 0; si < series.length; si++) {
        const s = series[si];
        if (s.length < 2) continue;
        ctx.beginPath();
        ctx.strokeStyle = colors[si];
        ctx.lineWidth = 1.5;
        for (let i = 0; i < s.length; i++) {
          const x = (i / (GRAPH_LEN - 1)) * W;
          const y = H - ((s[i] - lo) / range) * H;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // Legend: adaptive font size for many channels; stop when labels overflow canvas height
      const lineH = series.length > 5 ? 10 : 13;
      const fSize = series.length > 5 ?  9 : 10;
      ctx.font = `${fSize}px monospace`;
      for (let i = 0; i < series.length; i++) {
        const labelY = (fSize + 2) + i * lineH;
        if (labelY > H - 2) break;
        const s = series[i];
        if (!s.length) continue;
        ctx.fillStyle = colors[i];
        ctx.fillText(`${labels[i]}=${s[s.length - 1]}`, 3, labelY);
      }
    }

    function resizeGraphCanvases() {
      for (const el of document.querySelectorAll('#graph-panel canvas')) {
        el.width  = el.offsetWidth  || 200;
        el.height = el.offsetHeight || 65;
      }
    }
    resizeGraphCanvases();
    window.addEventListener('resize', resizeGraphCanvases);

    function drawAllGraphs() {
      for (const dev of ['left_controller', 'right_controller']) {
        const prefix = dev === 'left_controller' ? 'l' : 'r';
        for (const g of GROUPS) {
          const el = document.getElementById(`graph-${prefix}-${g.key}`);
          drawGraph(el, graphData[dev][g.key], g.colors, g.labels);
        }
      }
      requestAnimationFrame(drawAllGraphs);
    }
    requestAnimationFrame(drawAllGraphs);

    // ── WebSocket connection ────────────────────────────────────────────────
    const wsUrl = new URLSearchParams(window.location.search).get('ws');
    const status = document.getElementById('status');

    if (!wsUrl) {
      status.textContent = 'no ?ws= param';
    } else {
      const ws = new WebSocket(wsUrl);
      ws.onopen  = () => { status.textContent = 'connected'; };
      ws.onclose = () => { status.textContent = 'disconnected'; };
      ws.onerror = () => { status.textContent = 'error'; };
      ws.onmessage = (evt) => {
        let poses;
        try { poses = JSON.parse(evt.data); } catch { return; }
        for (const p of poses) {
          const [px, py, pz] = p.position;
          const [qw, qx, qy, qz] = p.orientation;
          let mesh, lineEl, label;
          if      (p.device === 'headset')          { mesh = hmdMesh; lineEl = hmdLine; label = 'HMD'; }
          else if (p.device === 'left_controller')  { mesh = lcMesh;  lineEl = lcLine;  label = 'L  '; }
          else if (p.device === 'right_controller') { mesh = rcMesh;  lineEl = rcLine;  label = 'R  '; }
          else continue;
          mesh.rotationQuaternion = new BABYLON.Quaternion(qx, qy, qz, qw);
          const smoothed = applyEMA(p.device, [px, py, pz]);
          mesh.position.set(...smoothed);
          // Overlay: show raw position (not smoothed) so you can see actual sensor values
          let extras = '';
          if (p.touch_x !== undefined && p.touch_x < 254) {
            extras += `touch=[${p.touch_x},${p.touch_y}]  `;
          }
          if (p.battery) {
            extras += `bat=${Math.round(p.battery / 2.55)}%`;
          }
          updateLine(lineEl, label, p.position, p.orientation, extras.trim() || null);
          if (p.sensor_raw) {
            pushSensorSample(p.device, p.sensor_raw);
          }
        }
      };
    }
  </script>
</body>
</html>
